<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

    <title>식당 리스트</title>

    <!--
      홈 화면 아이콘.
      iOS는 "홈 화면에 추가"를 누른 시점의 최상위 문서에서만 아이콘을 읽습니다.
      예전처럼 여기서 Apps Script로 리다이렉트하면 이 태그는 읽히기 전에 사라지고,
      Apps Script HTML의 head는 iframe 안이라 Safari가 볼 수 없어
      제목 첫 글자로 만든 문자 아이콘("식")이 나옵니다.
      그래서 리다이렉트 대신 iframe으로 감싸 이 페이지에 머무르게 합니다.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

    <!-- 홈 화면에서 앱처럼 실행 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="식당 리스트">
    <meta name="theme-color" content="#F7F8FA">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:title" content="AIoT융합팀 식당 리스트">
    <meta property="og:description" content="승인된 팀원만 접근할 수 있습니다.">
    <meta property="og:image" content="/icon-512.png">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #F7F8FA;
        overflow: hidden;
      }
      /* 아이폰 노치 / 하단 홈 인디케이터 영역 확보 */
      #shell {
        height: 100%;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #app {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <iframe
        id="app"
        title="식당 리스트"
        src="https://script.google.com/macros/s/AKfycbyr9mJ_YH-lLFuf1R1YNL8nqWDu7L-XOukVGcL1aAg-QvBh-cXMSw08z_P_HgsBAupE/exec"
      ></iframe>
    </div>
  </body>
</html>
