<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="apple-touch-icon" href="/IMG_9246.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ 식당 리스트</title>
    
    <!-- 카카오톡 미리보기 메타 태그 -->
    <meta property="og:title" content="🍽️ 식당 리스트">
    <meta property="og:description" content="식당 이용 내역 관리 페이지입니다.">
    <meta property="og:image" content="https://i.postimg.cc/PJp6TZ53/image.png">
    
    <style>
        /* 폰트 적용 (프리텐다드) */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 세로 중앙 정렬 */
            align-items: center;     /* 가로 중앙 정렬 */
            font-family: 'Pretendard', sans-serif;
            background-color: #F7F8FA; /* 깔끔하고 연한 배경색 */
            color: #111827;
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 30px;
        }
        
        /* 뱅글뱅글 돌아가는 스피너 애니메이션 */
        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #E5E7EB; /* 연한 회색 테두리 */
            border-top: 5px solid #10B981; /* 에메랄드 그린 포인트 */
            border-radius: 50%;
            animation: spin 1s linear infinite; /* 1초마다 무한 회전 */
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <!-- 화면에 보여질 내용 -->
    <h1 class="title">AIoT융합팀 식당 리스트</h1>
    <p class="subtitle">이동 중입니다...</p>
    <div class="spinner"></div>

    <!-- 사람만 구글 시트로 이동시키는 자바스크립트 -->
    <script>
        // 화면을 0.8초(800ms) 보여준 뒤에 이동합니다.
        setTimeout(function() {
            window.location.replace("https://script.google.com/macros/s/AKfycbyr9mJ_YH-lLFuf1R1YNL8nqWDu7L-XOukVGcL1aAg-QvBh-cXMSw08z_P_HgsBAupE/exec");
        }, 800); 
    </script>
</body>
</html>
